apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketmei
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jpest67/TicketMei.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ticketmei
  syncPolicy:
    automated:
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticketmei-monitoring
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: '92.17.0'
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/prometheus/values.yml
    - repoURL: https://github.com/jpest67/TicketMei.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true