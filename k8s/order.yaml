apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ticketmei
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
        - name: order
          image: ghcr.io/jpest67/ticketmei-order:38a08ef1f99fc09cb824ebc85aebbcd55fb270fe
          ports:
            - containerPort: 8002
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: order-data
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ticketmei
spec:
  selector:
    app: order
  ports:
    - port: 8002
      targetPort: 8002
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-data
  namespace: ticketmei
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi