apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: order-pvc
  namespace: ticketmei
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order
  namespace: ticketmei
spec:
  selector:
    matchLabels:
      app: order
  template:
    metadata:
      labels:
        app: order
    spec:
      containers:
      - name: order
        image: ghcr.io/jpest67/ticketmei-order:38a08ef1f99fc09cb824ebc85aebbcd55fb270fe
        ports:
        - containerPort: 8002
        env:
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
        volumeMounts:
        - name: order-storage
          mountPath: /data
      volumes:
      - name: order-storage
        persistentVolumeClaim:
          claimName: order-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: order
  namespace: ticketmei
spec:
  ports:
  - port: 8002
    targetPort: 8002
  selector:
    app: order