apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: ticketmei
spec:
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - name: notification
        image: ghcr.io/jpest67/ticketmei-notification:38a08ef1f99fc09cb824ebc85aebbcd55fb270fe
        ports:
        - containerPort: 8003
        env:
        - name: RABBITMQ_URL
          value: "amqp://rabbitmq:5672"
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: ticketmei
spec:
  ports:
  - port: 8003
    targetPort: 8003
  selector:
    app: notification