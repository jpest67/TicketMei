apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: ticketmei
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: ghcr.io/jpest67/ticketmei-notification:SHA
          ports:
            - containerPort: 8003
          volumeMounts:
            - name: data
              mountPath: /usr/src/app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notification-data
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: ticketmei
spec:
  selector:
    app: notification
  ports:
    - port: 8003
      targetPort: 8003
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-data
  namespace: ticketmei
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi