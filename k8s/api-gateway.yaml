apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ticketmei
spec:
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/jpest67/ticketmei-api-gateway:38a08ef1f99fc09cb824ebc85aebbcd55fb270fe
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis:6379"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ticketmei
spec:
  type: LoadBalancer
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: api-gateway