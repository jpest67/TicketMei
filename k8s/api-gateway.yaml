apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/jpest67/ticketmei-api-gateway:SHA #REPLACE FOR REAL IMAGE
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ticketmei
spec:
  selector:
    app: api-gateway
  ports:
    - name: port-8000
      port: 8000
      targetPort: 8000
      nodePort: 30000