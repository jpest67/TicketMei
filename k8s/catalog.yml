apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      containers:
        - name: catalog
          image: ghcr.io/jpest67/ticketmei-catalog:3cfc2fc379e512f1baecd00758bcccc3152cc082
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ticketmei
spec:
  selector:
    app: catalog
  ports:
    - port: 8001
      targetPort: 8001