apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: ticketmei
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
      - name: payment
        image: payment:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8004
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: ticketmei
spec:
  selector:
    app: payment
  ports:
  - protocol: TCP
    port: 8004
    targetPort: 8004