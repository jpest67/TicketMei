apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: ticketmei
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      hostname: rabbitmq
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
            - containerPort: 15692
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: plugins
              mountPath: /etc/rabbitmq/enabled_plugins
              subPath: enabled_plugins
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
        - name: plugins
          configMap:
            name: rabbitmq-plugins
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ticketmei
spec:
  selector:
    app: rabbitmq
  ports:
    - name: port-5672
      port: 5672
      targetPort: 5672
    - name: port-15672
      port: 15672
      targetPort: 15672
    - name: port-15692
      port: 15692
      targetPort: 15692
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: ticketmei
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins
  namespace: ticketmei
data:
  enabled_plugins: "[rabbitmq_management,rabbitmq_prometheus]."